<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudClinic – Healthcare Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F4F6FA;
      color: #1E293B;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    input, select, textarea, button { font-family: inherit; }
    button { cursor: pointer; }
    a { text-decoration: none; color: inherit; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    .slide-in { animation: slideIn 0.25s ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="cc-data.jsx"></script>
  <script type="text/babel" src="cc-store.jsx"></script>
  <script type="text/babel" src="cc-auth.jsx"></script>
  <script type="text/babel" src="cc-sidebar.jsx"></script>
  <script type="text/babel" src="cc-clinic-landing.jsx"></script>
  <script type="text/babel" src="cc-chart.jsx"></script>
  <script type="text/babel" src="cc-dashboard.jsx"></script>
  <script type="text/babel" src="cc-patients.jsx"></script>
  <script type="text/babel" src="cc-opd.jsx"></script>
  <script type="text/babel" src="cc-ipd.jsx"></script>
  <script type="text/babel" src="cc-admin-wards.jsx"></script>
  <script type="text/babel" src="cc-prescription.jsx"></script>
  <script type="text/babel" src="cc-rx-list.jsx"></script>
  <script type="text/babel" src="cc-print.jsx"></script>
  <script type="text/babel" src="cc-medicine.jsx"></script>
  <script type="text/babel" src="cc-app.jsx"></script>
</body>
</html>
