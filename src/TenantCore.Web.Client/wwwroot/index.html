<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudClinic</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <style>
        /* WASM boot loader */
        #cc-boot {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0A1628 0%, #1565C0 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            z-index: 99999;
        }
        #cc-boot-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 20px;
            padding: 40px 56px;
            text-align: center;
            backdrop-filter: blur(8px);
            min-width: 280px;
        }
        #cc-boot-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #1976D2, #42A5F5);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 32px rgba(21,101,192,0.5);
        }
        #cc-boot h2 {
            margin: 0 0 4px;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }
        #cc-boot p {
            margin: 0 0 24px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        #cc-boot-bar-wrap {
            height: 4px;
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
            overflow: hidden;
        }
        #cc-boot-bar {
            height: 100%;
            background: linear-gradient(90deg, #42A5F5, #ffffff, #42A5F5);
            background-size: 200% 100%;
            border-radius: 4px;
            animation: cc-boot-slide 1.4s ease infinite;
        }
        @keyframes cc-boot-slide {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="cc-boot">
            <div id="cc-boot-card">
                <div id="cc-boot-icon">
                    <!-- Medical cross SVG — renders on every browser/OS -->
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="15" y="4" width="10" height="32" rx="3" fill="white"/>
                        <rect x="4" y="15" width="32" height="10" rx="3" fill="white"/>
                    </svg>
                </div>
                <h2>CloudClinic</h2>
                <p>Hospital Management System</p>
                <div id="cc-boot-bar-wrap">
                    <div id="cc-boot-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;
         background:#FEF2F2;border-top:2px solid #FECACA;padding:12px 20px;
         display:none;align-items:center;justify-content:space-between;
         font-family:'Roboto',sans-serif;font-size:13px;color:#991B1B;z-index:99999;">
        <span>⚠️ An unhandled error occurred.</span>
        <span>
            <a href="" class="reload" style="color:#1565C0;font-weight:700;margin-right:12px;">Reload</a>
            <a class="dismiss" style="cursor:pointer;color:#64748B;font-weight:600;">Dismiss</a>
        </span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
